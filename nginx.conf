# Конфигурация Nginx для Fitness City
# Скопируйте этот блок в конфигурацию вашего сайта

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    root /path/to/your/website;
    index index.html;

    # Основной location - все запросы идут на index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кеширование статических файлов (изображения, CSS, JS)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Безопасность
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Логирование
    access_log /var/log/nginx/fitness-city-access.log;
    error_log /var/log/nginx/fitness-city-error.log;
}

